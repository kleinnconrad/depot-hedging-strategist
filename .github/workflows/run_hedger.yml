name: Run Hedging Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # Run daily at 1 AM UTC

jobs:
  run-hedger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Hedging Engine
        env:
          CURRENT_DEPOT_JSON: ${{ secrets.CURRENT_DEPOT_JSON }}
        run: uv run main.py
          
      - name: Export results to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: uv run scripts/update_gist.py
