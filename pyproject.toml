[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depot-hedging-strategist"
version = "1.1.0"
description = "Depot Hedging Strategist"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "pandas>=2.0.0",
    "yfinance>=1.7.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.2.3"
]
